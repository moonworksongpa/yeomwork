function g(id){return document.getElementById(id);}
function toast(t){var e=g('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},1900);}
function keepBlank(t){return t.replace(/^[ \t]*$/gm,'\u200B');}
function won(n){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2})+'원';}
function pad2(n){return String(n).padStart(2,'0');}

function toDate(s){if(!s)return null;var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function toStr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function kDate(s){var d=toDate(s);if(!d)return'';return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';}

// 시작일 + N개월 + M일 - 1일
function addPeriod(startStr,months,days){
  var d=toDate(startStr);if(!d)return null;
  var y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  var ty=y,tm=m+months;
  ty+=Math.floor(tm/12);tm=((tm%12)+12)%12;
  var last=new Date(ty,tm+1,0).getDate();
  var e=new Date(ty,tm,Math.min(day,last));
  e.setDate(e.getDate()+days-1);
  return e;
}
// 시작일~종료일 -> 개월/일수 역산
function diffPeriod(startStr,endStr){
  var s=toDate(startStr),e=toDate(endStr);
  if(!s||!e||e<s)return null;
  var months=0;
  while(true){
    var t=addPeriod(startStr,months+1,0);
    if(t&&t<=e)months++;else break;
    if(months>600)break;
  }
  var base=addPeriod(startStr,months,0);
  var days=base?Math.round((e-base)/86400000):0;
  return{months:months,days:days};
}
function periodLabel(months,days){
  var p=[];
  if(months)p.push(months+'개월');
  if(days)p.push(days%7===0?(days/7)+'주':days+'일');
  return p.length?p.join(' '):'';
}

var anchor='monthly';
function num(id){var v=parseFloat(g(id).value);return isFinite(v)?v:0;}
function put(id,v){g(id).value=v?String(Math.round(v*100)/100):'';}

function recalc(){
  var months=parseInt(g('months').value)||0;
  var net=num('net'),mon=num('monthly'),tot=num('total');
  if(vat==='incl'){
    if(anchor==='net'&&net){mon=net*1.1;put('monthly',mon);put('total',months?mon*months:0);}
    else if(anchor==='monthly'&&mon){put('net',mon/1.1);put('total',months?mon*months:0);}
    else if(anchor==='total'&&tot){mon=months?tot/months:0;put('monthly',mon);put('net',mon/1.1);}
  }else{
    if(anchor==='total'&&tot){put('monthly',months?tot/months:0);}
    else if(mon){put('total',months?mon*months:0);}
    g('net').value='';
  }
  render();
}

function applyMode(){
  var incl=vat==='incl';
  g('f-net').style.display=incl?'block':'none';
  g('l-mon').textContent=incl?'월 이용료 (부가세 포함)':'월 이용료 (부가세X)';
  g('l-total').textContent=incl?'총 이용료 (부가세 포함)':'총 이용료 (현금가/부가세X)';
  if(!incl){g('net').value='';if(anchor==='net')anchor='monthly';}
  recalc();
}

var lock=false;
function syncFromPeriod(){
  if(lock)return;lock=true;
  var s=g('start').value,months=parseInt(g('months').value)||0,days=parseInt(g('days').value)||0;
  if(s&&(months||days)){
    var e=addPeriod(s,months,days);
    if(e)g('end').value=toStr(e);
  }
  lock=false;render();
}
function syncFromEnd(){
  if(lock)return;lock=true;
  var s=g('start').value,en=g('end').value;
  if(s&&en){
    var r=diffPeriod(s,en);
    if(r){g('months').value=r.months||'';g('days').value=r.days||'';}
  }
  lock=false;render();
}
function render(){
  var mo=parseInt(g('monthly').value)||0;
  var months=parseInt(g('months').value)||0;
  var days=parseInt(g('days').value)||0;
  var s=g('start').value,en=g('end').value;
  var total=parseFloat(g('total').value)||0;
  var pl=periodLabel(months,days);

  if(total&&pl){
    g('amt').innerHTML=seat+' · <span class="amt-val">'+won(total)+'</span> '+(vat==='cash'?'(현금가)':'(부가세 포함)')+' / '+pl+' 계약';
  }else if(total&&!pl){
    g('amt').textContent='계약 기간을 입력해주세요';
  }else{
    g('amt').textContent='이용료를 입력해주세요';
  }

  g('dep').textContent='예치금 '+won(deposit)+' (퇴실 시 환급)';

  if(!total||!pl||!s||!en){
    g('pv').textContent='정보를 입력하면 메시지가 만들어집니다';
    return;
  }
  var range=kDate(s)+' – '+kDate(en);
  var vatTag=vat==='cash'?'':' (부가세 포함)';
  var feeLabel=months?months+'개월':pl;
  g('pv').textContent=MSG.contract
    .replace(/{SEAT}/g,seat)
    .replace(/{DEPOSIT}/g,won(deposit))
    .replace(/{FEEPERIOD}/g,feeLabel)
    .replace(/{PERIOD}/g,pl)
    .replace(/{TOTAL}/g,won(total))
    .replace(/{VATTAG}/g,vatTag)
    .replace(/{RANGE}/g,range);
}

function copyText(text,onOk){
  if(!text){toast('먼저 정보를 입력해주세요');return;}
  text=keepBlank(text);
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:.01;font-size:16px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('복사됐어요!');if(onOk)onOk();}
  catch(e){toast('복사 실패 — 다시 시도해주세요');}
  document.body.removeChild(ta);
}

function buildQuick(){
  var LABEL={blue:'상담 후',green:'(신규) 입금 확인 후',purple:'(기존) 입금 확인 후',red:'(기존) 계약 만료 안내',brown:'(종료 확정) 서류 안내',orange:'입주 안내'};
  var html='',lastColor=null;
  QUICK.forEach(function(q){
    if(q.divider)html+='<div class="grp-div"></div>';
    if(q.color!==lastColor){
      html+='<div class="set-label set-label-'+q.color+'">'+(LABEL[q.color]||'')+'</div>';
      lastColor=q.color;
    }
    html+='<div class="qset qset-'+q.color+'" data-key="'+q.key+'">'+
      '<span class="qtag">'+q.step+'</span>'+
      '<span class="qb-title">'+q.title+'</span>'+
      '<span class="qb-copy">복사</span></div>';
  });
  g('quick').innerHTML=html;
  g('quick').onclick=function(e){
    var el=e.target.closest('.qset');if(!el)return;
    var key=el.dataset.key;
    var txt;
    if(key==='contract'){
      txt=g('pv').textContent;
      if(txt.indexOf('정보를 입력하면')===0){toast('먼저 정보를 입력해주세요');return;}
    }else{
      txt=MSG[key];
    }
    copyText(txt,function(){
      el.classList.add('ok');
      el.querySelector('.qb-copy').textContent='복사됨';
    });
  };
}
function init(){
  var t=new Date();
  g('start').value=toStr(t);
  g('months').value=3;

  g('seat-seg').onclick=function(e){
    var el=e.target.closest('.sg');if(!el)return;
    seat=el.dataset.s;deposit=parseInt(el.dataset.dep);
    this.querySelectorAll('.sg').forEach(function(b){b.classList.toggle('on',b.dataset.s===seat);});
    render();
  };
  g('vat-seg').onclick=function(e){
    var el=e.target.closest('.sg');if(!el)return;
    vat=el.dataset.v;
    this.querySelectorAll('.sg').forEach(function(b){b.classList.toggle('on',b.dataset.v===vat);});
    applyMode();
  };
  ['net','monthly','total'].forEach(function(id){
    g(id).addEventListener('input',function(){anchor=id;recalc();});
  });
  g('months').addEventListener('input',function(){syncFromPeriod();recalc();});
  g('days').addEventListener('input',syncFromPeriod);
  g('start').addEventListener('change',syncFromPeriod);
  g('end').addEventListener('change',function(){syncFromEnd();recalc();});
  g('cp').onclick=function(){
    var t=g('pv').textContent;
    if(t.indexOf('정보를 입력하면')===0){toast('먼저 정보를 입력해주세요');return;}
    copyText(t);
  };

  buildQuick();
  syncFromPeriod();
  applyMode();
}
init();
</script>
</body>
</html>
